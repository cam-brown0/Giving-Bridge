services:
  db:
    image: mysql:8.4
    container_name: charity_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pw
      MYSQL_DATABASE: charity          # must match the schema name in schema.sql
      MYSQL_USER: charity
      MYSQL_PASSWORD: charity_dev_pw
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mysqldata: