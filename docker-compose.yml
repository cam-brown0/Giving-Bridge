services:
  db:
    image: postgres:16
    container_name: charity_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: charity
      POSTGRES_PASSWORD: charity_dev_pw
      POSTGRES_DB: charity
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: